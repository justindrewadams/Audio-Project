name: Sermon podcast

on:
  schedule:
    # Every Sunday night after the PM service (Monday 06:17 UTC = Sunday 12:17/1:17 AM Central).
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      command:
        description: What to do
        type: choice
        default: run
        options:
          - run             # check for new services and process them
          - test            # process only the most recent Sunday service
          - voice yes       # these videos ARE his sermons
          - voice no        # these videos are NOT his sermons
          - add             # include a video it skipped
          - retry           # try a failed video again
          - backfill        # process up to 20 older services in one go
          - check           # safe test: only list the channel's services, publish nothing
      video_ids:
        description: Video ID(s), separated by spaces (for voice yes / voice no / add / retry)
        type: string
        required: false

permissions:
  contents: write   # save state, upload episode audio to the "episodes" release
  pages: write
  id-token: write

concurrency:
  group: sermonpod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      CONFIG: cloud/config.toml
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore saved state
        run: |
          git config user.name "sermonpod"
          git config user.email "sermonpod@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin sermonpod-data >/dev/null; then
            git fetch --depth=1 origin sermonpod-data:sermonpod-data
            git worktree add data sermonpod-data
          else
            git worktree add --orphan -b sermonpod-data data
            printf 'raw/\ntranscripts/\nmodels/\n' > data/.gitignore
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -e .

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            data/models
          key: models-v1

      - name: Settings and secrets
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > cookies.txt; fi
          if [ -n "$OWNER_EMAIL" ]; then
            python - <<'PY'
          import os, re, pathlib
          p = pathlib.Path(os.environ["CONFIG"])
          email = os.environ["OWNER_EMAIL"].replace('"', "")
          p.write_text(re.sub(r'^owner_email = .*$', f'owner_email = "{email}"', p.read_text(), flags=re.M))
          PY
          fi

      - name: Run
        env:
          COMMAND: ${{ github.event.inputs.command || 'run' }}
          VIDEO_IDS: ${{ github.event.inputs.video_ids }}
        run: |
          ids="$(echo "$VIDEO_IDS" | tr ',' ' ' | xargs)"
          if [ -n "$ids" ] && ! echo "$ids" | grep -Eq '^[A-Za-z0-9_-]{11}( [A-Za-z0-9_-]{11})*$'; then
            echo "::error::Video IDs look wrong: '$ids' (each is 11 characters, like dQw4w9WgXcQ)"; exit 1
          fi
          if [ -z "$ANTHROPIC_API_KEY" ] && [ "$COMMAND" != check ] && [ "$COMMAND" != "voice no" ]; then
            echo "::error::Add your Claude key first: Settings > Secrets and variables > Actions > New repository secret, named ANTHROPIC_API_KEY"
            exit 1
          fi
          needs_ids() { if [ -z "$ids" ]; then echo "::error::'$COMMAND' needs at least one video ID"; exit 1; fi; }
          case "$COMMAND" in
            check)     sermonpod -c "$CONFIG" discover --scan 30 ;;
            test)      sermonpod -c "$CONFIG" run --scan 8 --limit 1 ;;
            run)       sermonpod -c "$CONFIG" run --scan 30 --limit 8 ;;
            backfill)  sermonpod -c "$CONFIG" run --limit 20 ;;
            "voice yes") needs_ids; sermonpod -c "$CONFIG" voice yes $ids
                         sermonpod -c "$CONFIG" run --no-discover --limit 8 ;;
            "voice no")  needs_ids; sermonpod -c "$CONFIG" voice no $ids
                         sermonpod -c "$CONFIG" feed ;;
            add)       needs_ids; for id in $ids; do sermonpod -c "$CONFIG" add "$id"; done
                       sermonpod -c "$CONFIG" run --no-discover --limit 8 ;;
            retry)     needs_ids; for id in $ids; do sermonpod -c "$CONFIG" retry "$id"; done
                       sermonpod -c "$CONFIG" run --no-discover --limit 8 ;;
            *) echo "::error::unknown command $COMMAND"; exit 1 ;;
          esac
          sermonpod -c "$CONFIG" status | tail -40

      - name: Upload new episodes
        if: always()
        run: |
          shopt -s nullglob
          files=(output/podcast/episodes/*.mp3)
          [ ${#files[@]} -eq 0 ] && { echo "no new episodes"; exit 0; }
          gh release view episodes >/dev/null 2>&1 || \
            gh release create episodes --title "Podcast episodes" \
              --notes "Audio files for the podcast feed. Managed by the Sermon podcast workflow."
          gh release upload episodes "${files[@]}" --clobber

      - name: Save state
        if: always()
        run: |
          cd data
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "State after run ${{ github.run_number }}"
          git push origin HEAD:sermonpod-data

      - name: Prepare site
        if: always() && github.event.inputs.command != 'check'
        run: |
          [ -f output/podcast/feed.xml ] || sermonpod -c "$CONFIG" feed
          # cover art: built from his photo if one has been uploaded, else the plain cover
          photo=$(ls cloud/photo.* 2>/dev/null | head -1)
          if [ -n "$photo" ]; then
            sermonpod cover "$photo" -o output/podcast/cover.jpg
          else
            cp cloud/cover.jpg output/podcast/
          fi
          rm -rf output/podcast/episodes   # audio is served from the release

      - uses: actions/upload-pages-artifact@v3
        if: always() && github.event.inputs.command != 'check'
        with:
          path: output/podcast

  publish:
    needs: build
    if: always() && needs.build.result != 'cancelled' && github.event.inputs.command != 'check'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
